name: Vibe Trading Lead Gen

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-lead-gen:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Lead Generation Script
      env:
        DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DUNE_SOLANA_QUERY_ID: ${{ secrets.DUNE_SOLANA_QUERY_ID }}
        DUNE_EVM_QUERY_ID: ${{ secrets.DUNE_EVM_QUERY_ID }}
      run: python main.py

    - name: Commit and push state file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add processed_leads.json
        git commit -m "Update processed leads state" -a || echo "No changes to commit"
        git push
