name: Solana Momentum Phase 2

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/3 * * * *"

permissions:
  contents: write

concurrency:
  group: solana-momentum-phase2
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 2 Regime-Aware Momentum Tracker
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TLEGRAM_CHAT_ID }}
        run: python phase2_momentum_tracker.py

      - name: Persist state (commit DB back to repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=$(git branch --show-current)
          git add solana_momentum_phase1.db
          git diff --staged --quiet || git commit -m "chore: persist phase2 state [skip ci]"
          git pull --rebase origin "$BRANCH" || true
          git push origin "$BRANCH" || true
