name: solana-smart-money

on:
  workflow_dispatch:   # driven by cron-job.org heartbeat #3 every 15 minutes

permissions:
  contents: write

concurrency:
  group: solana-smart-money-pipeline
  cancel-in-progress: false

jobs:
  smart-money:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Phase 6 - Solana Smart Money Stalker
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python solana_smart_money.py

      - name: Persist Phase 6 SQLite state
        if: always()
        run: |
          git config user.name "insider-hunter-bot"
          git config user.email "insider-hunter-bot@users.noreply.github.com"
          git add solana_smart_money.db || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist phase6 state [skip ci]"
            git pull --rebase origin main || true
            git push || { git pull --rebase origin main && git push; }
          fi
