name: solana-breakout

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes (perfect for tracker milestones)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-breakout-pipeline
  cancel-in-progress: false

jobs:
  breakout-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Solana Breakout Tracker (Discovery)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python solana_breakout.py

      - name: Run Solana Performance Tracker (8h Follow-up)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python solana_tracker.py

      - name: Persist SQLite state
        if: always()
        run: |
          git config user.name "insider-hunter-bot"
          git config user.email "insider-hunter-bot@users.noreply.github.com"
          git add solana_breakout.db || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist solana state [skip ci]"
            git push
          fi
