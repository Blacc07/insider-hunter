name: run-bot

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-hunter-pipeline
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (Discovery)
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Run profiler (Forensic Analysis)
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wallet_profiler.py

      - name: Run sheets sync (Dashboard)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python sheets_sync.py

      - name: Persist SQLite state back to repo
        if: always()
        run: |
          git config user.name "insider-hunter-bot"
          git config user.email "insider-hunter-bot@users.noreply.github.com"
          git add insider_hunter.db || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist sqlite state [skip ci]"
            git push
          fi

# ... (Previous steps: Checkout, Setup Python, pip install, bot.py, wallet_profiler.py) ...

      - name: Run Phase 4 - Pre-Launch Syndicate Tracker
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python funder_tracker.py

# ... (Next steps: sheets_sync.py, git commit, etc.) ...
